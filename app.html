<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ATB507 App 项目页面。" />
    <title>App / ATB507</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .app-page { min-height: 70vh; padding: 100px 0 150px; }
      .app-hero { display: grid; grid-template-columns: 1fr .8fr; gap: 10%; align-items: end; }
      .app-hero h1 { max-width: 700px; margin-bottom: 30px; }
      .app-hero h1 em { color: var(--orange); font-style: normal; }
      .app-intro { max-width: 390px; color: var(--muted); font-size: 1rem; line-height: 1.7; }
      .app-mark { position: relative; aspect-ratio: 1; overflow: hidden; background: var(--lime); }
      .app-mark::before { position: absolute; top: 14%; left: 14%; width: 72%; height: 72%; border: 1px solid var(--ink); border-radius: 50%; content: ''; }
      .app-mark::after { position: absolute; right: 16%; bottom: 15%; width: 42%; height: 42%; border-radius: 50%; background: var(--orange); content: ''; }
      .app-mark strong { position: absolute; z-index: 1; top: 50%; left: 50%; font-family: var(--display); font-size: clamp(2rem, 5vw, 4.5rem); letter-spacing: -.1em; transform: translate(-50%, -50%) rotate(-12deg); }
      .app-modules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 110px; border-top: 1px solid var(--line); }
      .app-module { padding: 22px 0 0; border-top: 3px solid var(--orange); }
      .app-module span { color: var(--orange); font-size: .7rem; font-weight: 700; }
      .app-module h2 { margin: 35px 0 14px; font-size: 1.5rem; letter-spacing: -.06em; }
      .app-module p { max-width: 270px; margin: 0; color: var(--muted); font-size: .8rem; line-height: 1.65; }
      @media (max-width: 760px) { .app-page { padding: 70px 0 100px; }.app-hero { grid-template-columns: 1fr; gap: 55px; }.app-mark { max-width: 390px; }.app-modules { grid-template-columns: 1fr; gap: 35px; margin-top: 75px; } }
    </style>
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="index.html#top" aria-label="回到首页"><span>CV</span><i>张子艺</i></a>
        <nav class="main-nav" aria-label="主导航">
          <a href="index.html#work">作品</a>
          <a href="index.html#experience">经历</a>
          <a href="index.html#about">关于</a>
          <a href="app.html" aria-current="page">App</a>
        </nav>
        <a class="header-contact" href="mailto:hello@zhangziyi.com">联系我 <span>↗</span></a>
        <button class="menu-toggle" type="button" aria-label="打开菜单" aria-expanded="false">☰</button>
      </header>

      <main class="app-page">
        <section class="app-hero" aria-labelledby="app-title">
          <div>
            <p class="eyebrow">05 / app projects</p>
            <h1 id="app-title">把想法装进<br /><em>一个 App。</em></h1>
            <p class="app-intro">这里会持续记录我参与设计、研究和构建的 App 项目。从第一个草图，到真正被使用的那一刻。</p>
            <a class="button button-primary" href="mailto:hello@zhangziyi.com">一起做点什么 <span>↗</span></a>
          </div>
          <div class="app-mark" aria-label="App 项目视觉封面"><strong>APP</strong></div>
        </section>

        <section class="app-modules" aria-label="App 项目方向">
          <article class="app-module"><span>01</span><h2>产品构想</h2><p>从真实的问题出发，梳理需求、场景和一条清楚的产品路径。</p></article>
          <article class="app-module"><span>02</span><h2>体验设计</h2><p>让复杂的功能变得自然，让每一次操作都更接近用户的直觉。</p></article>
          <article class="app-module"><span>03</span><h2>持续迭代</h2><p>用原型和反馈快速验证，让一个想法逐步长成可以使用的产品。</p></article>
        </section>
      </main>

      <footer class="site-footer"><span>© <span id="year"></span> ATB507</span><span>Designed & built with curiosity</span><a href="#top">回到顶部 ↑</a></footer>
    </div>
    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  </body>
</html>
